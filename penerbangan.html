<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiket Penerbangan</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f9; color: #333; }
        header { background: #0066cc; color: white; padding: 15px 20px; text-align: center; }
        .container { max-width: 600px; margin: 30px auto; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; }
        
        .airport-img {
            width: 100%;
            height: 200px;  
            object-fit: cover;
            display: block;
        }

        .content { padding: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0066cc; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0052a3; }
        .result-box { background: #e6f2ff; padding: 15px; border-radius: 4px; margin-top: 15px; border-left: 5px solid #0066cc; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <h2>✈️ Tiket Pesawat</h2>
    </header>
    
    <div class="container">
        <!-- GAMBAR BANDARA -->
        <img src="https://images.unsplash.com/photo-1542296332-2e4473faf563?auto=format&fit=crop&w=1000&q=80" alt="Gambar Bandara" class="airport-img">

        <div class="content">
            <!-- FORM PENCARIAN -->
            <div id="searchSection">
                <h3>Cari Jadwal Penerbangan</h3>
                <form onsubmit="cariPenerbangan(event)">
                    <div class="form-group">
                        <label>Dari:</label>
                        <select id="asal" required>
                            <option value="">Pilih Kota Asal</option>
                            <option value="Jakarta (CGK)">Jakarta (CGK)</option>
                            <option value="Surabaya (SUB)">Surabaya (SUB)</option>
                            <option value="Bali (DPS)">Bali (DPS)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ke Tujuan:</label>
                        <select id="tujuan" required>
                            <option value="">Pilih Kota Tujuan</option>
                            <option value="Bali (DPS)">Bali (DPS)</option>
                            <option value="Singapore (SIN)">Singapore (SIN)</option>
                            <option value="Tokyo (HND)">Tokyo (HND)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Berangkat:</label>
                        <input type="date" id="tanggal" required>
                    </div>

                    <button type="submit">Cari Tiket</button>
                </form>
            </div>

            <!-- HASIL PEMESANAN -->
            <div id="resultSection" class="hidden">
                <h3>🎉 Pesanan Berhasil!</h3>
                <div class="result-box">
                    <p><strong>Kode Booking:</strong> <span id="outKode"></span></p>
                    <p><strong>Rute:</strong> <span id="outRute"></span></p>
                    <p><strong>Tanggal:</strong> <span id="outTanggal"></span></p>
                    <p><strong>Maskapai:</strong> Garuda Indonesia (Ekonomi)</p>
                </div>
                <br>
                <button onclick="resetForm()">Cari Lagi</button>
            </div>
        </div>
    </div>

    <script>
        function cariPenerbangan(event) {
            event.preventDefault();
            const asal = document.getElementById('asal').value;
            const tujuan = document.getElementById('tujuan').value;
            const tanggal = document.getElementById('tanggal').value;
            
            if (asal === tujuan) {
                alert("Kota Asal dan Tujuan tidak boleh sama!");
                return;
            }
            
            const kodeAcak = 'ID-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('outKode').innerText = kodeAcak;
            document.getElementById('outRute').innerText = asal + " ➔ " + tujuan;
            document.getElementById('outTanggal').innerText = tanggal;
            
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('searchSection').classList.remove('hidden');
            document.getElementById('resultSection').classList.add('hidden');
        }
    </script>
</body>
</html>
